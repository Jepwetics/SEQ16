# Tiny Tapeout project information
project:
  title:        "SEQ16 Programmable Sequencer"
  author:       "JET"
  discord:      ""
  description:  "16-instruction programmable sequencer driving 16 output pins"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_jet_seq16"

  # List your source files here. Source files must be in ./src and you
  # must list each one separately, one per line.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank.
pinout:
  # Inputs
  ui[0]: "SCK - program load clock"
  ui[1]: "MOSI - program load data"
  ui[2]: "CS_N - program load select, active low"
  ui[3]: "RUN - high to execute, low to reset the core"
  ui[4]: "IN0 - branch input 0"
  ui[5]: "IN1 - branch input 1"
  ui[6]: "IN2 - branch input 2"
  ui[7]: "IN3 - branch input 3"

  # Outputs
  uo[0]: "OUTL0"
  uo[1]: "OUTL1"
  uo[2]: "OUTL2"
  uo[3]: "OUTL3"
  uo[4]: "OUTL4"
  uo[5]: "OUTL5"
  uo[6]: "OUTL6"
  uo[7]: "OUTL7"

  # Bidirectional pins (all driven as outputs)
  uio[0]: "OUTH0"
  uio[1]: "OUTH1"
  uio[2]: "OUTH2"
  uio[3]: "OUTH3"
  uio[4]: "OUTH4"
  uio[5]: "OUTH5"
  uio[6]: "OUTH6"
  uio[7]: "OUTH7"

# Do not change!
yaml_version: 6
